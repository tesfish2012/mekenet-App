name: safeinsurance_mobile
description: SafeInsurance - Enterprise Insurance Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1
  retrofit: ^4.6.0

  # Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Connectivity
  connectivity_plus: ^6.1.4
  internet_connection_checker_plus: ^2.7.2

  # Firebase
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.3.1

  # UI
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.0
  lottie: ^3.1.3
  google_fonts: ^6.3.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # Responsive
  flutter_screenutil: ^5.9.3

  # Files
  image_picker: ^1.2.0
  file_picker: ^10.3.1
  permission_handler: ^12.0.1
  open_file: ^3.5.10
  path_provider: ^2.1.5

  # Authentication
  local_auth: ^2.3.0

  # Localization
  easy_localization: ^3.0.8
  intl: ^0.19.0

  # Charts
  syncfusion_flutter_charts: ^30.1.42

  # Utilities
  equatable: ^2.0.7
  logger: ^2.6.1
  dartz: ^0.10.1
  package_info_plus: ^8.3.1
  device_info_plus: ^11.5.0
  url_launcher: ^6.3.2
  share_plus: ^11.1.0
  flutter_staggered_animations: ^1.1.1
  pinput: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.4.15

  freezed: ^3.0.6
  json_serializable: ^6.8.0

  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3

  injectable_generator: ^2.7.0
  retrofit_generator: ^9.1.7

  mockito: ^5.4.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/translations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
